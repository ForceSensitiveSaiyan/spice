services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORS_ORIGINS=*
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./apps/api/spice:/app/spice
      - ./packages:/packages
      - spice-data:/app/spice/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3737:3737"
    environment:
      - API_URL=http://api:5000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  spice-data:
